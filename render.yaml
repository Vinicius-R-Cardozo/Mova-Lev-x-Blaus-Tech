# Blueprint do Render — plano FREE (homologação).
# Render → New → Blueprint → este repositório. Segredos com `sync: false` são pedidos na criação
# (valores em docs/DEPLOY.md).
#
# Diferenças do plano Free:
#   • a API hiberna após 15 min sem acesso (a 1ª chamada depois disso leva ~50 s);
#   • não há Cron Job nem pre-deploy: a expiração de pedidos roda dentro da API
#     (EXPIRE_ORDERS_INTERVAL_MINUTES) e as migrações rodam no build.
# Para produção, veja "Subir para o plano pago" em docs/DEPLOY.md.
services:
  - type: web
    name: movalev-api
    runtime: node
    region: virginia          # mais perto do Supabase (São Paulo) entre as regiões do Render
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @movalev/api && npm run db:deploy -w @movalev/api
    startCommand: node api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: EXPIRE_ORDERS_INTERVAL_MINUTES
        value: "5"
      - key: CORS_ORIGINS
        sync: false            # https://<projeto>.vercel.app (e o domínio próprio quando existir)
      - key: SITE_URL
        sync: false            # https://<projeto>.vercel.app
      - key: DATABASE_URL
        sync: false            # pooler do Supabase em modo SESSÃO (porta 5432) + ?connection_limit=5
      - key: DIRECT_URL
        sync: false            # pooler em modo sessão, porta 5432 (migrações no build)
      - key: SUPABASE_URL
        value: https://cxmkuqkhvdhwvrdkzckk.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # service_role LEGADA (JWT "eyJ...")
      - key: STORAGE_BUCKET
        value: produtos
      - key: ORDER_RESERVATION_MINUTES
        value: "60"
      - key: BOLETO_RESERVATION_HOURS
        value: "72"
      - key: WEB_REVALIDATE_URL
        sync: false            # https://<projeto>.vercel.app/api/revalidate
      - key: REVALIDATE_SECRET
        sync: false            # mesmo valor configurado na Vercel
      - key: RESEND_API_KEY
        sync: false            # vazio por enquanto (e-mails ficam só no log)
      - key: EMAIL_FROM
        value: MOVA LEV <pedidos@movalev.com.br>
      - key: STORE_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
